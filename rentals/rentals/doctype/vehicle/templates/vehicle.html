{% extends "templates/web.html" %}

{% block page_content %}
    <h1>{{ title }}</h1>
    <h2>Color:{{ doc.color }}</h2>

    {% if doc.vehicle_image %}
        <img src="{{ doc.vehicle_image }}" alt="Vehicle Image" style="max-width: 100%; height: auto;">
    {% else %}
        <p>No image available for this vehicle.</p>
    {% endif %}
    <!-- <img src="{{ doc.vehicle_image }}" alt="Vehicle Image" style="max-width: 100%; height: auto;"> -->

    <a class = "btn btn-primary" href="/order-a-ride/new?vehicle={{ doc.name }}" target="_blank">Book Ride</a>
{% endblock %}

<!-- this is a sample default web page template -->
